<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنصة التعليمية - تسجيل الدخول</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
    }
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #2a0845 0%, #642b73 50%, #c86dd7 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }
    /* خلفيات وأشكال دائرية زاهية */
    body::before, body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
    }
    body::before {
      width: 300px;
      height: 300px;
      background: #8e44ad;
      top: -50px;
      right: -50px;
      opacity: 0.6;
    }
    body::after {
      width: 350px;
      height: 350px;
      background: #e056fd;
      bottom: -80px;
      left: -80px;
      opacity: 0.5;
    }
    .auth-container {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 420px;
      margin: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .brand-title {
      text-align: center;
      color: #3b1443;
      margin-bottom: 25px;
      font-size: 24px;
      font-weight: 800;
    }
    .brand-title span {
      color: #9b51e0;
    }
    .tabs {
      display: flex;
      background: #f0e6f5;
      border-radius: 12px;
      padding: 5px;
      margin-bottom: 25px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #6a1b9a;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 15px;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #6a1b9a, #ab47bc);
      color: white;
      box-shadow: 0 4px 12px rgba(106, 27, 154, 0.3);
    }
    .auth-box {
      display: none;
    }
    .auth-box.active {
      display: block;
    }
    .input-group {
      margin-bottom: 18px;
    }
    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #4a148c;
      font-weight: 600;
      font-size: 14px;
    }
    .input-group input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e1bee7;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s;
      background: #faf5fc;
    }
    .input-group input:focus {
      border-color: #8e24aa;
      background: #ffffff;
    }
    .auth-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4a148c, #8e24aa);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 6px 18px rgba(74, 20, 140, 0.35);
    }
    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(74, 20, 140, 0.45);
    }
    .error-msg {
      color: #d32f2f;
      background: #ffebee;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      margin-top: 15px;
      display: none;
      border: 1px solid #ffcdd2;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="brand-title">🎓 المنصة <span>التعليمية</span></div>
    
    <div class="tabs">
      <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
      <button id="tab-signup" class="tab-btn" onclick="switchTab('signup')">حساب جديد</button>
    </div>

    <!-- تسجيل الدخول -->
    <div id="login-box" class="auth-box active">
      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="login-email" placeholder="example@domain.com" required>
      </div>
      <div class="input-group">
        <label>كلمة المرور</label>
        <input type="password" id="login-password" placeholder="••••••••" required>
      </div>
      <button id="login-btn" class="auth-btn">دخول المنصة ✨</button>
    </div>

    <!-- تسجيل حساب جديد -->
    <div id="signup-box" class="auth-box">
      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input type="email" id="signup-email" placeholder="example@domain.com" required>
      </div>
      <div class="input-group">
        <label>كلمة المرور</label>
        <input type="password" id="signup-password" placeholder="••••••••" required>
      </div>
      <button id="signup-btn" class="auth-btn">إنشاء الحساب 🚀</button>
    </div>

    <div id="error-message" class="error-msg"></div>
  </div>

  <script>
    function switchTab(type) {
      document.getElementById('error-message').style.display = 'none';
      if(type === 'login') {
        document.getElementById('login-box').classList.add('active');
        document.getElementById('signup-box').classList.remove('active');
        document.getElementById('tab-login').classList.add('active');
        document.getElementById('tab-signup').classList.remove('active');
      } else {
        document.getElementById('signup-box').classList.add('active');
        document.getElementById('login-box').classList.remove('active');
        document.getElementById('tab-signup').classList.add('active');
        document.getElementById('tab-login').classList.remove('active');
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
